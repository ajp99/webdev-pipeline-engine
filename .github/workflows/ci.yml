# CI (P1-T12, D-287, D-336). No secrets are used or needed. Two checks on every pull request: "Checks" (lint,
# types, unit tests, docs and the database checks on Postgres 16) and "Build" (the end-to-end test and the master
# starter), whose heavy steps run only when the app, packages, starter, database or e2e files change. Nothing
# repeats on push to main: the pull request already ran it. The local Supabase stack check and the mutation
# check have their own workflows.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:lint:test
      - run: pnpm doctor:test
      - run: pnpm docs:lint

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Database checks (Postgres 16)
        run: bash supabase/tests/run.sh

  build:
    # P2-T14 and P3-T02: the end-to-end flow in a browser against the local Supabase stack (models scripted, no
    # secrets), then the master starter's tests, build and Lighthouse 80+ on every category. Skipped, and passing,
    # when a pull request changes none of the paths below; a manual run always runs it.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the heavy steps run
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo build=true >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if echo "$changed" | grep -qE '^(apps/|packages/|templates/|supabase/|scripts/e2e\.sh|pnpm-lock\.yaml|package\.json|\.github/workflows/ci\.yml)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"; echo 'No app, package, starter or database change: skipped.'
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.build == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.build == 'true'
      - run: pnpm --filter @wpe/web exec playwright install --with-deps chromium
        if: steps.changes.outputs.build == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.build == 'true'
        with:
          version: 3.2.0
      - run: supabase start
        if: steps.changes.outputs.build == 'true'
      - run: supabase db reset
        if: steps.changes.outputs.build == 'true'
      - run: bash scripts/e2e.sh
        if: steps.changes.outputs.build == 'true'
      - if: steps.changes.outputs.build == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/e2e-*.log
          retention-days: 7
      - if: steps.changes.outputs.build == 'true' && always()
        run: supabase stop --no-backup

      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
      - run: pnpm test
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
      - run: pnpm typecheck
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
      - run: pnpm check:content
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
      - run: pnpm build
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
      - name: Lighthouse on the built site
        if: steps.changes.outputs.build == 'true'
        working-directory: templates/master-starter
        run: |
          MAIL_TRANSPORT=stub MAIL_TRANSPORT_ALLOW_STUB=1 pnpm start -p 3000 > /tmp/starter.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          # Three runs per page and the median per category: single runs on shared runners are noisy.
          for path in / /about; do
            name=$(echo "$path" | tr -c 'a-z\n' '_')
            for i in 1 2 3; do
              npx -y lighthouse@12 "http://localhost:3000$path" --quiet --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="/tmp/lh$name$i.json"
            done
            echo "Lighthouse $path"
            node scripts/lighthouse-check.mjs 0.8 /tmp/lh"$name"{1,2,3}.json
          done
