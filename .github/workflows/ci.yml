# CI (P1-T12, D-287). No secrets are used or needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, types, tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:lint:test
      - run: pnpm doctor:test
      - run: pnpm docs:lint

  database:
    name: Database checks (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/run.sh

  supabase:
    # Runs the same suites against the local Supabase stack (Supabase CLI and Docker). It passed on GitHub
    # on 2026-10-15 (PR #15), so it now blocks like the other jobs.
    name: Database checks (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Create the CLI config if the repo has none yet
        run: '[ -f supabase/config.toml ] || supabase init'
      - run: supabase start
      - run: supabase db reset
      - name: Run the suites against the stack
        env:
          WPE_SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash supabase/tests/run.sh
      - if: always()
        run: supabase stop --no-backup

  e2e:
    # P2-T14: the 2b flow in a browser against the local Supabase stack, with the models scripted (no secrets).
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpe/web exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase start
      - run: supabase db reset
      - run: bash scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/e2e-*.log
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  starter:
    # P3-T02: the master starter's tests, a production build (fonts downloaded from Google Fonts at build time)
    # and Lighthouse 80+ on every category, for the home page and a content page.
    name: Master starter (tests, build, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/master-starter
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:content
      - run: pnpm build
      - name: Lighthouse on the built site
        run: |
          MAIL_TRANSPORT=stub MAIL_TRANSPORT_ALLOW_STUB=1 pnpm start -p 3000 > /tmp/starter.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          # Three runs per page and the median per category: single runs on shared runners are noisy.
          for path in / /about; do
            name=$(echo "$path" | tr -c 'a-z\n' '_')
            for i in 1 2 3; do
              npx -y lighthouse@12 "http://localhost:3000$path" --quiet --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="/tmp/lh$name$i.json"
            done
            echo "Lighthouse $path"
            node scripts/lighthouse-check.mjs 0.8 /tmp/lh"$name"{1,2,3}.json
          done
