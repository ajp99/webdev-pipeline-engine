# Mutation check for the database rules (P1-T13, D-288): breaks each rule on purpose and requires a
# check to fail. Runs on pull requests that touch supabase/** and on demand (before each phase gate).
name: Mutation check

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/mutations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    name: Mutation check (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/mutations.sh
